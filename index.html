<!DOCTYPE html>
<html lang="ja" data-who="natsuki">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>花丸勉強帳</title>
<meta name="theme-color" content="#FFE6EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="花丸勉強帳">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* 教室の黒板と学習帳。上が黒板(日付と週)、下がマス目のノート(計画)。主役は赤い花丸。 */
:root{
  color-scheme:light;
  --board:#1F4D3F; --board-deep:#173D32; --chalk:#F7F5EC; --chalk-dim:#B9CFC5;
  --paper:#FDFEFD; --grid:#DCEBF0; --ink:#21302B; --ink-soft:#54645E;
  --maru:#E2352B; --tray:#A9764A; --desk:#DDE8E3;
  --s-kokugo:#C93A72; --s-sansu:#2467B8; --s-rika:#1F8049;
  --s-shakai:#A66200; --s-rikasha:#0E7C86; --s-eigo:#7B4BB8; --s-other:#5F6E69;
  --hand:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Noto Sans JP",sans-serif;
  --ui:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Noto Sans JP",sans-serif;
  --masu:28px;
}
/* なつき: 淡いピンクの丸い世界。あおい: 淡い水色の直線的な世界。文字は共通 */
:root{--ui:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Noto Sans JP",sans-serif;--hand:var(--ui);--display:var(--ui);--display-w:900}
:root[data-who="natsuki"]{
  --board:#FFE6EE; --board-deep:#FFD6E3; --chalk:#4A2A3B; --chalk-dim:#7A5A6B;
  --paper:#FFFDFE; --desk:#FFF3F7; --soft:#FFF2F6; --head:#FFF2F6; --line:#F8E2EA;
  --ink:#3D2A35; --ink-soft:#6E5864; --btn:#FBC6D8; --btn-fg:#4A2A3B; --go:#FBC6D8; --pick-bg:#FBC6D8; --pick-fg:#4A2A3B;
  --tray:#FFD3E1; --stick-off:rgba(255,255,255,.7); --bar:#FBC6D8;
  --art:radial-gradient(circle,rgba(255,255,255,.5) 3px,transparent 4px);
  --r-s:14px; --r-m:18px; --r-l:24px; --r-p:999px;
}
:root[data-who="aoi"]{
  --board:#DFEEFC; --board-deep:#CBE1F7; --chalk:#1B3350; --chalk-dim:#4C6480;
  --paper:#FBFDFF; --desk:#EDF5FD; --soft:#EEF5FD; --head:#EEF5FD; --line:#DCE8F4;
  --ink:#1D2C3F; --ink-soft:#4E6076; --btn:#B7D6F4; --btn-fg:#1B3350; --go:#B7D6F4; --pick-bg:#B7D6F4; --pick-fg:#1B3350;
  --tray:#FFD9C2; --stick-off:rgba(255,255,255,.75); --bar:#FFC49E;
  --art:none;
  --r-s:3px; --r-m:4px; --r-l:6px; --r-p:4px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--desk);color:var(--ink);font-family:var(--ui);font-size:18px;line-height:1.5;-webkit-text-size-adjust:100%;word-break:auto-phrase;line-break:strict;overflow-wrap:anywhere}
rt{font-size:.55em;font-family:var(--ui);font-weight:500}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;touch-action:manipulation}
:focus-visible{outline:3px solid #F2B21B;outline-offset:2px}
h1,h2,p{margin:0}
.app{max-width:560px;margin:0 auto;min-height:100dvh;background:var(--paper);display:flex;flex-direction:column;padding-bottom:calc(76px + env(safe-area-inset-bottom))}

/* 黒板 */
.board{background:var(--board);color:var(--chalk);padding:12px 16px 0;display:grid;gap:12px}
.board-top{display:flex;align-items:center;gap:8px}
.board-title{flex:1;min-width:0;font-family:var(--hand);font-weight:600}
.board-title h1{font-size:32px;line-height:1.2;font-weight:600;text-wrap:balance}
.board-title p{font-size:19px;color:var(--chalk-dim)}
.nav-btn{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:var(--chalk);flex:none}
.nav-btn:active{background:var(--board-deep)}
.nav-btn svg{width:24px;height:24px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.day{display:grid;justify-items:center;gap:1px;padding:6px 0 4px;border-radius:12px;color:var(--chalk);font-family:var(--hand);min-height:78px;align-content:start}
.day small{font-size:14px;color:var(--chalk-dim)}
.day b{font-size:21px;font-weight:600;line-height:1.2}
.day .mark{height:22px;display:grid;place-items:center}
.day.is-today b{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:2px}
.day[aria-current="date"]{background:var(--chalk);color:var(--ink)}
.day[aria-current="date"] small{color:var(--ink-soft)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--chalk-dim)}
.day[aria-current="date"] .dot{background:var(--ink-soft)}
.say{font-family:var(--hand);font-size:22px;font-weight:600;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.say button{font-family:var(--ui);font-size:16px;text-decoration:underline;text-underline-offset:3px;min-height:44px;color:var(--chalk)}
.tray{margin:0 -16px;background:var(--tray);min-height:18px;padding:0 16px;display:flex;gap:6px;align-items:flex-start;border-top:3px solid var(--board-deep)}
.tray i{display:block;width:38px;height:9px;border-radius:3px;margin-top:-6px;background:#3B6A5B}
.tray i.on{background:color-mix(in srgb,var(--c) 45%,#fff)}

.who{background:var(--board);padding:calc(10px + env(safe-area-inset-top)) 16px 0;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.who button{min-height:48px;border-radius:12px;border:2px solid var(--chalk-dim);color:var(--chalk);font-weight:700;font-size:18px}
.who button[aria-pressed="true"]{background:var(--chalk);border-color:var(--chalk);color:var(--ink)}

/* ノート */
main{flex:1;background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:var(--masu) var(--masu);padding:16px 16px 24px;display:grid;gap:16px;align-content:start}
.note{background:#FFF6D6;border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:16px}
.note button{flex:none;min-height:44px;padding:0 12px;border-radius:22px;background:#fff;border:2px solid var(--ink);font-weight:700;font-size:15px}
.list{display:grid;background:var(--paper);border-top:2px solid var(--ink)}
.task{display:grid;grid-template-columns:8px 1fr 68px;gap:12px;align-items:center;text-align:left;width:100%;min-height:88px;padding:8px 0;border-bottom:2px solid var(--ink)}
.task:active{background:#F1F6F4}
.bar{align-self:stretch;background:var(--c);border-radius:4px}
.task h2{font-family:var(--hand);font-size:24px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.task p{font-size:16px;color:var(--ink-soft);line-height:1.9}
.ring{width:60px;height:60px;justify-self:center;display:grid;place-items:center}
.ring .empty{width:46px;height:46px;border:3px dashed #9DB0A9;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--ink-soft);line-height:1.1;text-align:center}
.task.done h2{color:var(--ink-soft)}
.add{min-height:64px;width:100%;border-radius:32px;background:var(--ink);color:#fff;font-weight:700;font-size:20px;display:flex;align-items:center;justify-content:center;gap:8px}
.add:active{background:#000}
.empty-box{background:var(--paper);padding:20px 8px;text-align:center;display:grid;gap:12px;font-size:18px}
.ghost{min-height:52px;border:2px solid var(--ink);border-radius:26px;padding:0 18px;font-weight:700;background:var(--paper)}
.hana{color:var(--maru);fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.draw path{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .9s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* 1しゅうかんの表 */
.sec{display:grid;gap:6px;background:var(--paper)}
.sec-h{display:flex;align-items:baseline;gap:8px;font-family:var(--hand);font-size:22px;font-weight:600}
.sec-h span{font-size:17px;color:var(--ink-soft)}
.none{color:var(--ink-soft);font-size:16px;padding:6px 0 2px}
.wk{background:var(--paper);border-top:2px solid var(--ink);display:grid}
.wrow{display:grid;grid-template-columns:50px 1fr 1fr;border-bottom:2px solid var(--ink)}
.wrow>*{min-width:0;padding:6px;border-left:1px solid #B9C9C3}
.wrow>.wdc{border-left:0;padding:6px 0}
.wrow.hd{font-weight:700;font-size:15px;text-align:center;background:#EEF4F1}
.wrow.now{background:#FFF6D6}
.wd{display:grid;align-content:start;justify-items:center;width:100%;min-height:64px;font-family:var(--hand)}
.wd small{font-size:14px;color:var(--ink-soft)}
.wd b{font-size:23px;font-weight:600;line-height:1.2}
.wc{display:grid;gap:6px;align-content:start}
.it{display:grid;grid-template-columns:1fr auto;gap:2px 4px;align-items:center;text-align:left;width:100%;min-height:48px;padding:4px 4px 4px 8px;border-left:5px solid var(--c);background:rgba(255,255,255,.75);border-radius:2px 6px 6px 2px}
.it:active{background:#F1F6F4}
.it strong{font-family:var(--hand);font-weight:600;font-size:16px;line-height:1.25}
.it em{grid-column:1;font-style:normal;font-size:13px;color:var(--ink-soft);line-height:1.9}
.it svg{grid-column:2;grid-row:1/3;width:22px;height:22px}
.plus{min-height:44px;width:100%;border:2px dashed #9DB0A9;border-radius:8px;color:var(--ink-soft);font-weight:700;font-size:15px}
.opts.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.opt.dc{display:grid;justify-items:center;padding:4px 0;min-height:58px;border-radius:10px;line-height:1.2;font-family:var(--hand)}
.opt.dc small{font-size:13px}
.opt.dc b{font-size:19px;font-weight:600}
.opt.mini{min-height:44px;padding:2px 12px;font-size:15px}

/* きろく */
.panel{background:var(--paper);display:grid;gap:10px}
.panel h2{font-family:var(--hand);font-size:22px;font-weight:600}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;background:var(--paper)}
.stat:first-child{grid-column:1/-1}
.stat:first-child b{font-size:34px}
.stat{border-top:2px solid var(--ink);padding-top:6px}
.stat b{display:block;font-family:var(--hand);font-size:25px;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{font-size:14px;color:var(--ink-soft)}
.card{display:grid;grid-template-columns:repeat(7,1fr);border-left:2px solid var(--ink);border-top:2px solid var(--ink)}
.card>*{border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);min-width:0}
.card .hd{text-align:center;font-size:14px;padding:2px 0;background:#EEF4F1}
.cell{position:relative;aspect-ratio:1;display:block;width:100%;background:var(--paper)}
.cell.blank{background:#F2F5F3}
.cell .n{position:absolute;left:4px;top:1px;font-size:13px;color:var(--ink-soft);font-family:var(--hand);z-index:1;text-shadow:0 0 2px #fff,0 0 2px #fff}
.cell.is-today{background:#FFF6D6}
.cell .st{position:absolute;inset:14% 4% 0;display:grid;place-items:center}
.cell .st svg{width:100%;height:100%}
.part{width:46%;aspect-ratio:1;border:3px solid var(--maru);border-radius:50%}
.plan{width:7px;height:7px;background:#9DB0A9;border-radius:50%}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:15px;color:var(--ink-soft)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend svg{width:22px;height:22px}
.legend .part{width:15px;border-width:2px}
.rows{display:grid;gap:10px}
.row{display:grid;grid-template-columns:76px 1fr auto;gap:8px;align-items:center;font-size:16px}
.track{height:14px}
.fill{height:100%;min-width:6px;background:var(--c);border-radius:0 4px 4px 0}
.row b{font-weight:700;font-variant-numeric:tabular-nums}

/* タブ */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;background:var(--paper);border-top:2px solid var(--ink);padding-bottom:env(safe-area-inset-bottom)}
.tabs div{display:grid;grid-template-columns:1fr 1fr 1fr;width:100%;max-width:560px}
.tabs button{min-height:68px;display:grid;justify-items:center;align-content:center;gap:3px;line-height:1.3;font-weight:700;font-size:16px;color:var(--ink-soft)}
.tabs button svg{width:28px;height:28px}
.tabs button[aria-selected="true"]{color:var(--maru)}

/* シート */
dialog{border:0;padding:0;margin:auto auto 0;width:100%;max-width:560px;max-height:92dvh;border-radius:20px 20px 0 0;background:var(--paper);color:var(--ink)}
dialog::backdrop{background:rgba(23,61,50,.55)}
.sheet{padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:grid;gap:16px}
.sheet-head{display:flex;align-items:flex-start;gap:8px}
.sheet-head h2{flex:1;font-family:var(--hand);font-size:26px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.close{width:48px;height:48px;flex:none;border-radius:50%;background:#EEF4F1;display:grid;place-items:center}
.close svg{width:20px;height:20px}
fieldset{border:0;padding:0;margin:0;display:grid;gap:8px;min-width:0}
legend.q{padding:0;font-weight:700;font-size:18px;margin-bottom:8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts.grid3{display:grid;grid-template-columns:repeat(3,1fr)}
.opt{min-height:52px;padding:6px 14px;border:2px solid var(--c,var(--ink));border-radius:14px;font-weight:700;background:var(--paper)}
.opt[aria-pressed="true"]{background:var(--c,var(--ink));color:#fff}
.opt.face{display:grid;justify-items:center;gap:2px;font-size:15px;padding:8px 2px}
.opt.face svg{width:34px;height:34px}
.text{width:100%;min-height:52px;border:2px solid var(--ink);border-radius:14px;padding:8px 14px;background:#fff;font-size:18px}
.step{display:grid;grid-template-columns:64px 1fr 64px;align-items:center;text-align:center}
.step button{height:64px;border-radius:50%;border:2px solid var(--ink);font-size:30px;font-weight:700;line-height:1}
.step output{font-family:var(--hand);font-size:34px;font-weight:600}
.go{min-height:64px;width:100%;border-radius:32px;background:var(--maru);color:#fff;font-weight:700;font-size:20px;background:#C9261D}
.go:disabled{background:#E5EAE7;color:var(--ink-soft);cursor:default}
#go{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom));box-shadow:0 0 0 6px var(--paper)}
.sub{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.link{min-height:48px;padding:0 12px;text-decoration:underline;text-underline-offset:3px;color:var(--ink-soft);font-size:16px}
.link.warn{color:#B3201A;font-weight:700}
.lead{font-size:18px}

/* 花丸の瞬間 */
.cele{position:fixed;inset:0;z-index:20;display:none;place-items:center;pointer-events:none}
.cele.on{display:grid;animation:fade 1.7s ease forwards}
.cele div{display:grid;justify-items:center;gap:4px;background:rgba(255,255,255,.93);border-radius:50%;width:min(76vw,300px);aspect-ratio:1;align-content:center}
.cele svg{width:62%}
.cele p{font-family:var(--hand);font-weight:600;font-size:24px}
@keyframes fade{0%,75%{opacity:1}100%{opacity:0}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
/* 見やすさ: 線を静かに、小さな文字を大きく、マス目をなくす */
.who,.board{background-color:var(--board)}
.board{background-image:var(--art);background-repeat:no-repeat}
.board-title,.say{font-family:var(--display)}
.board-title,.board-title h1,.say{font-weight:var(--display-w)}
.board-title p{font-size:18px;font-weight:500}
.who button{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-color:var(--chalk-dim)}
.who button svg{width:24px;height:24px}
.who button[aria-pressed="true"]{background:var(--pick-bg);border-color:var(--pick-bg);color:var(--pick-fg)}
.day small{font-size:15px;color:var(--chalk-dim)}
.day[aria-current="date"]{background:var(--pick-bg);color:var(--pick-fg)}
.day[aria-current="date"] small{color:inherit}
.dot,.day[aria-current="date"] .dot{background:currentColor}
.day .mark{height:26px}
.day .mark svg{width:26px;height:26px;background:#fff;border-radius:50%;padding:1px}
.nav-btn:active{background:var(--board-deep)}
.tray{border-top-color:var(--board-deep)}
.tray i{background:var(--stick-off)}
.tray i.on{background:color-mix(in srgb,var(--c) 30%,#fff)}
main{background-image:none;gap:18px}
.note{background:var(--soft);font-size:17px}
.note button{background:var(--paper);border-color:var(--ink)}
.add{background:var(--btn)}
.add:active{background:var(--btn);opacity:.85}
.list{border-top:1px solid var(--line)}
.task{border-bottom:1px solid var(--line);min-height:92px}
.task:active,.it:active{background:var(--soft)}
.task p{font-size:17px}
.ring .empty{width:54px;height:54px;font-size:14px;border-color:var(--ink-soft)}
.none{font-size:17px}
.wk{border-top:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.wrow{border-bottom:1px solid var(--line)}
.wrow:last-child{border-bottom:0}
.wrow>*{border-left:1px solid var(--line)}
.wrow.hd{background:var(--head);font-size:17px}
.wrow.hd>*{padding:8px 4px}
.wrow.now{background:var(--soft)}
.wd small{font-size:15px}
.wd i{font-style:normal;font-size:13px;font-weight:700;font-family:var(--ui);background:var(--btn);color:#fff;border-radius:8px;padding:0 6px;margin-top:2px}
.it{background:#fff;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:54px}
.it strong{font-size:17px}
.it em{font-size:15px}
.it svg{width:26px;height:26px}
.plus{border-color:var(--line);border-style:solid;background:#fff;font-size:16px}
.stat{border-top:1px solid var(--line)}
.stat span{font-size:16px}
.card{border-left:1px solid var(--line);border-top:1px solid var(--line)}
.card>*{border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.card .hd{background:var(--head);font-size:15px}
.cell.blank{background:transparent}
.cell.is-today{background:var(--soft)}
.cell .n{font-size:14px}
.legend{font-size:16px}
.row{font-size:17px}
.tabs{border-top:1px solid var(--line)}
.tabs button{position:relative;font-size:17px}
.tabs button[aria-selected="true"]{color:var(--ink)}
.tabs button[aria-selected="true"]::before{content:"";position:absolute;inset:6px 14px;border-radius:14px;background:var(--soft);z-index:-1}
.tabs div{isolation:isolate}
.close{background:var(--head)}
.opt{border-color:var(--c,var(--line))}
.opt[aria-pressed="true"]{background:var(--c,var(--btn));border-color:var(--c,var(--btn))}
.step button{border-color:var(--line)}
.text{border-color:var(--line)}
dialog::backdrop{background:rgba(20,25,30,.5)}

/* 時間割 */
.tabs div{grid-template-columns:repeat(4,1fr)}
.tabs button{font-size:16px}
.tg{display:grid;grid-template-columns:30px repeat(5,minmax(0,1fr));gap:3px}
.tg>*{min-width:0;min-height:42px;display:grid;place-items:center;font-size:16px;text-align:center;line-height:1.15}
.tg .th{font-weight:700;background:var(--head);border-radius:6px}
.tg .th.now{background:var(--btn);color:#fff}
.tg .pn{font-size:15px;color:var(--ink-soft)}
.tc{background:#fff;border:1px solid var(--line);border-bottom:4px solid var(--c,var(--line));border-radius:6px;font-weight:700}
.tc.off{border-bottom-color:var(--line);color:var(--ink-soft);font-weight:500}
.tg.edit button.tc[aria-pressed="true"]{outline:3px solid var(--maru);outline-offset:0}
.tc.test{background:#C9261D;color:#fff;border-color:#C9261D;border-bottom-color:#8A1610;align-content:center;gap:0}
.tc small{display:block;font-size:12px;font-weight:700;line-height:1.1}
.tg>.tc{min-height:48px}
.ttest{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;padding:10px 12px;min-height:64px;background:#FDE8E6;border-left:6px solid #C9261D;border-radius:4px 10px 10px 4px}
.ttest b{display:block;font-size:18px;color:#8A1610}
.ttest span{font-size:15px;color:var(--ink-soft)}
.ttest .when{font-size:15px;font-weight:700;color:#fff;background:#C9261D;border-radius:10px;padding:3px 10px;white-space:nowrap}
.ttest.past{background:transparent;border-left-color:var(--line)}
.ttest.past b{color:var(--ink-soft)}
.ttest.past .when{background:var(--head);color:var(--ink-soft)}
.tlist{display:grid;gap:8px}
.wtest{grid-column:1/-1;order:-1;background:#C9261D;color:#fff;font-weight:700;font-size:16px;padding:4px 10px!important;border-left:0!important}
.tbanner{background:#C9261D;color:#fff;border-radius:12px;padding:12px 14px;font-weight:700;font-size:19px;display:grid;gap:2px}
.tbanner span{font-weight:500;font-size:16px}
main>.tbanner{grid-column:1/-1;order:-4}
.hist{display:grid;grid-template-columns:60px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;padding:8px 0;border-bottom:1px solid var(--line);min-height:76px}
.hist:active{background:var(--soft)}
.thumb{width:60px;height:60px;border-radius:8px;object-fit:cover;background:var(--head);display:block}
.hist b{display:block;font-size:17px}
.hist span{font-size:15px;color:var(--ink-soft)}
.pill{font-size:14px;font-weight:700;background:var(--btn);color:#fff;border-radius:10px;padding:2px 9px}
.photo-box{position:sticky;top:0;z-index:2;background:var(--paper);display:grid;gap:6px;padding-bottom:6px}
.photo-scroll{max-height:32dvh;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--head)}
.photo-scroll img{display:block;width:100%}
.photo-scroll.big img{width:220%;max-width:none}
.photo-view{width:100%;border-radius:8px;border:1px solid var(--line);display:block}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.small{min-height:44px;padding:0 14px;border:2px solid var(--line);border-radius:12px;font-weight:700;font-size:16px;background:#fff;display:inline-flex;align-items:center}
.pick-file{position:relative;overflow:hidden;cursor:pointer}
.pick-file input{position:absolute;inset:0;opacity:0;font-size:40px;cursor:pointer}
.palette{position:sticky;bottom:0;z-index:2;background:var(--paper);padding:8px 0;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;border-top:1px solid var(--line)}
.palette button{min-height:44px;border:2px solid var(--c,var(--line));border-radius:8px;font-weight:700;font-size:15px;background:#fff;padding:0}
.addsubj{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:stretch}
.palette{max-height:30dvh;overflow:auto}
.err{color:#B3201A;font-weight:700}
.add{display:block;padding:16px 12px;text-align:center}
.add>span{margin-right:8px}
.tt-wrap{display:grid;gap:10px}
.tt-wrap>div:first-child{display:contents}
.photo-scroll{max-height:22dvh}
.palette button{min-height:40px}
.pl{display:grid;gap:6px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.pl b{font-size:17px}
.dt{display:grid;gap:8px;font-size:16px}
.dt div{border-bottom:1px solid var(--line);padding-bottom:8px}
.dt code,.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;overflow-wrap:anywhere}
.dt small{display:block;color:var(--ink-soft);font-size:14px}
textarea.text{min-height:120px;font-size:14px;font-family:ui-monospace,Menlo,Consolas,monospace;resize:vertical}
main>.ghost.last{order:9}

/* 文字のメリハリ: 見出しは極太、名前は太字、補足は細く小さく */
body{font-weight:500}
.board-title h1{font-size:34px;font-weight:900;letter-spacing:.01em}
.board-title p{font-size:17px;font-weight:700}
.say{font-size:22px;font-weight:900}
.sec-h,.panel h2,.sheet-head h2{font-size:24px;font-weight:900}
.sec-h span{font-size:17px;font-weight:700}
.task h2{font-size:24px;font-weight:900}
.task.done h2{font-weight:700}
.task p,.it em,.hist span,.stat span,.legend{font-weight:500}
.it strong{font-size:17px;font-weight:900}
.day b,.wd b{font-weight:900}
.day small,.wd small{font-weight:700}
.stat b{font-size:28px;font-weight:900}
.stat:first-child b{font-size:38px}
.add,.go{font-weight:900}
.opt,.small,.ghost,.palette button{font-weight:700}
.opt[aria-pressed="true"]{font-weight:900}
.tc{font-weight:900}
.tc.off{font-weight:500}
legend.q{font-weight:900;font-size:19px}
.wrow.hd{font-weight:900}
.step output{font-weight:900}
.cele p{font-weight:900}
.opt.dc b{font-weight:900}
.hist b{font-weight:900;color:var(--ink);font-size:18px}
.hist .pill{color:#fff;font-size:14px;font-weight:900}
.ttest b{font-weight:900}
.row b{font-weight:900}

/* これまでの時間割の操作 */
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hrow{display:grid;gap:6px;padding:4px 0 10px;border-bottom:1px solid var(--line)}
.hrow .hist{border-bottom:0;padding:4px 0;min-height:68px}
.hact{display:flex;gap:6px;flex-wrap:wrap}
.small.danger{color:#B3201A;border-color:#E9B8B4}
.small.danger.sure{background:#C9261D;border-color:#C9261D;color:#fff}
.small.solid{background:var(--btn);border-color:var(--btn);color:#fff}
.tg .th{display:grid;justify-items:center;align-content:center;line-height:1.15;font-weight:900;min-height:46px}
.tg .th small{font-size:12px;font-weight:700}
/* 1週間の表: テストは日にちの下に小さく */
.wrow{grid-template-columns:58px 1fr 1fr}
.wdt{display:block;width:calc(100% - 6px);margin-top:3px;padding:2px 1px;border-radius:5px;background:#C9261D;color:#fff;font-family:var(--ui);font-size:11px;font-weight:900;line-height:1.2;text-align:center}

/* 大きく読みやすく: 時間割を主役にし、小さい文字をなくす */
body{font-size:19px;line-height:1.55}
main{padding:18px 14px 28px;gap:24px}
.panel{gap:12px}
.tg{grid-template-columns:22px repeat(5,minmax(0,1fr));gap:4px}
.tg>*{font-size:19px;min-height:64px}
.tg>.tc{min-height:64px;border-radius:8px;line-height:1.2}
.tg .th{font-size:20px;min-height:58px;border-radius:8px}
.tg .th small{font-size:14px}
.tg .pn{font-size:17px;font-weight:700}
.tc small{font-size:13px;font-weight:900;margin-top:2px}
.tg.edit>*{min-height:54px;font-size:17px}
.tg.edit>.tc{min-height:54px}
.tg.edit .th{min-height:40px}
.palette button{font-size:16px;min-height:46px}
.task p{font-size:18px}
.it{min-height:60px;padding:6px 6px 6px 9px}
.it strong{font-size:18px;line-height:1.3}
.it em{font-size:16px}
.plus{min-height:48px;font-size:17px}
.wrow.hd{font-size:18px}
.wd small{font-size:16px}
.wd b{font-size:26px}
.wd i{font-size:14px}
.wdt{font-size:12px}
.day small{font-size:16px}
.day b{font-size:23px}
.ttest b{font-size:20px}
.ttest span{font-size:16px}
.ttest .when{font-size:16px}
.hist b{font-size:19px}
.hist span{font-size:16px}
.small{font-size:17px;min-height:48px}
.stat span,.legend,.row{font-size:18px}
.card .hd{font-size:16px}
.cell .n{font-size:15px}
.note{font-size:18px}
.note button{font-size:16px}
.none{font-size:18px}
.opt{font-size:18px}
.opt.mini{font-size:17px;min-height:48px}
.dt{font-size:17px}
.dt small{font-size:15px}
.tabs button{font-size:17px;min-height:72px}
.tabs button svg{width:30px;height:30px}
.app{padding-bottom:calc(84px + env(safe-area-inset-bottom))}

/* 回転する時間選び */
.wheel-wrap{position:relative;width:min(240px,100%);margin:0 auto;border-radius:16px;background:var(--head);overflow:hidden}
.wheel-wrap::before{content:"";position:absolute;left:8px;right:8px;top:88px;height:44px;border-radius:10px;background:var(--paper);border:2px solid var(--btn);pointer-events:none}
.wheel{position:relative;height:220px;padding:88px 0;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch;border-radius:16px}
.wheel::-webkit-scrollbar{display:none}
#go{position:static;box-shadow:none}
.wi{height:44px;line-height:44px;text-align:center;font-size:21px;font-weight:700;color:var(--ink-soft);scroll-snap-align:center;cursor:pointer;font-variant-numeric:tabular-nums;will-change:transform}
.wi.on{font-size:27px;font-weight:900;color:var(--ink)}

.task p.nt{color:var(--ink);font-weight:700;line-height:1.4;overflow-wrap:anywhere}
.it em.nt{color:var(--ink);font-weight:700;line-height:1.35;overflow-wrap:anywhere}
legend.q label{cursor:pointer}

.opts.grid5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.opt.face.five{padding:8px 0;gap:4px;border-color:var(--line)}
.opt.face.five b{font-size:24px;font-weight:900;line-height:1}
.opt.face.five svg{width:36px;height:36px}
.opt.face.five[aria-pressed="true"]{background:var(--btn);border-color:var(--btn);color:#fff}
.scale{display:flex;justify-content:space-between;gap:8px;font-size:16px;color:var(--ink-soft)}
.picked{text-align:center;font-size:21px;font-weight:900}

/* テストの結果 */
.tabs div{grid-template-columns:repeat(5,1fr)}
.tabs button{font-size:15px;line-height:1.2;padding:0 2px}
.tabs button svg{width:27px;height:27px}
.tabs button{min-height:88px;gap:2px;line-height:1.15}
.tabs button svg{width:25px;height:25px}
.tabs button[aria-selected="true"]::before{inset:4px 3px}
.tabs rt{font-size:9px}
.app{padding-bottom:calc(100px + env(safe-area-inset-bottom))}
.rc{display:grid;gap:10px;width:100%;text-align:left;padding:14px;border:1px solid var(--line);border-left:6px solid var(--c);border-radius:6px 12px 12px 6px;background:#fff}
.rc:active{background:var(--soft)}
.rc-h b{display:block;font-size:21px;font-weight:900}
.rc-h span{font-size:16px;color:var(--ink-soft)}
.scores{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:baseline}
.sc{display:inline-flex;align-items:baseline;gap:5px;font-size:17px;color:var(--ink-soft);font-weight:700}
.sc b{font-size:32px;font-weight:900;color:var(--ink);line-height:1.1;font-variant-numeric:tabular-nums}
.sc.total b{color:#B3201A}
.rlist{display:grid;gap:10px}
.rfield{display:grid;grid-template-columns:64px minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;font-weight:900;font-size:19px}
.rfield input{min-width:0;text-align:center;font-size:22px;font-weight:900;padding:8px 4px}
.rfield small{font-size:15px;font-weight:700;color:var(--ink-soft)}
.rhead{display:grid;grid-template-columns:64px minmax(0,1fr) auto minmax(0,1fr);gap:8px;font-size:15px;font-weight:700;color:var(--ink-soft);text-align:center}
.rinfo{background:#FDE8E6;border-left:6px solid #C9261D;border-radius:4px 10px 10px 4px;padding:10px 12px}
.rinfo b{display:block;font-size:20px;font-weight:900;color:#8A1610}

.sumt{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(4,minmax(0,1fr));border-top:1px solid var(--line)}
.sumt>*{padding:9px 4px;border-bottom:1px solid var(--line);text-align:right;font-size:18px;font-variant-numeric:tabular-nums;min-width:0}
.sumt>b{text-align:left;font-weight:900}
.sumt .h{font-size:15px;font-weight:700;color:var(--ink-soft);background:var(--head)}
.sumt .h:first-child{text-align:left;padding-left:6px}
.sumt .avg{font-weight:900}
.sumt .all{background:var(--soft);font-weight:900}

.tmode{grid-column:1/-1;border-color:#C9261D!important;color:#B3201A}
.tmode[aria-pressed="true"]{background:#C9261D!important;color:#fff}
main .tg button.tc:active{background:var(--soft)}
main .tg button.tc.test:active{background:#A91E16}

/* 人ごとの形 */
:root[data-who="natsuki"] .board{background-size:26px 26px;background-repeat:repeat}
:root[data-who="aoi"] .tray{min-height:20px;border-top:2px solid #fff;background:repeating-linear-gradient(115deg,#FFD9C2 0 20px,#FFE8DA 20px 30px)}
:root[data-who="aoi"] .tray i{margin-top:6px}
.sec-h,.panel>h2,.ph h2{display:flex;align-items:center;gap:8px}
.sec-h::before,.panel>h2::before,.ph h2::before{content:"";flex:none;width:7px;height:1em;background:var(--bar);border-radius:var(--r-p)}
:root[data-who="aoi"] .sec-h::before,:root[data-who="aoi"] .panel>h2::before,:root[data-who="aoi"] .ph h2::before{transform:skewX(-14deg)}
.go{background:var(--go);color:var(--btn-fg)}
.go:disabled{background:#EEF1EF;color:var(--ink-soft)}
.add,.add:active{background:var(--btn);color:var(--btn-fg)}
.pill,.wd i,.small.solid,.tg .th.now,.opt.face.five[aria-pressed="true"]{color:var(--btn-fg)}
.small.solid{background:var(--btn);border-color:var(--btn)}
.opt:not([style])[aria-pressed="true"]{color:var(--btn-fg)}
.hist .pill{color:var(--btn-fg)}
.add,.go,.ghost{border-radius:var(--r-p)}
:root[data-who="aoi"] .add,:root[data-who="aoi"] .go,:root[data-who="aoi"] .ghost{border-radius:var(--r-l)}
.who button,.day,.small,.opt,.note,.note button,.plus,.close,.pill,.when,.wd i,.wdt{border-radius:var(--r-s)}
:root[data-who="natsuki"] .opt,:root[data-who="natsuki"] .small,:root[data-who="natsuki"] .who button,:root[data-who="natsuki"] .note button,:root[data-who="natsuki"] .plus{border-radius:var(--r-p)}
.close{border-radius:50%}
:root[data-who="aoi"] .close{border-radius:var(--r-m)}
.opt.dc,.opt.face{border-radius:var(--r-s)}
.tc,.tg .th,.palette button{border-radius:var(--r-s)}
.wk,.rc,.ttest,.wheel-wrap,.wheel,.text,.photo-scroll,.thumb,.tbanner,.rinfo{border-radius:var(--r-m)}
.it{border-radius:var(--r-s)}
.wheel-wrap::before{border-radius:var(--r-s)}
.tabs button[aria-selected="true"]::before{border-radius:var(--r-m)}
dialog{border-radius:var(--r-l) var(--r-l) 0 0}

.ttnav{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--head);border-radius:var(--r-m);padding:2px}
.ttnav b{font-size:21px;font-weight:900;display:flex;align-items:baseline;gap:8px;font-variant-numeric:tabular-nums}
.ttnav b span{font-size:16px;color:var(--ink-soft)}
.ttnav .nav-btn{color:var(--ink)}
.tg .th.has-x{align-content:start;padding-top:4px}
.thx{display:block;margin-top:3px;background:#C9261D;color:#fff;border-radius:5px;font-size:11px;font-weight:900;line-height:1.2;padding:1px 3px;max-width:100%;overflow-wrap:anywhere}

.today-chip{display:inline-block;margin-bottom:4px;padding:3px 12px;border-radius:var(--r-p);background:var(--paper);color:var(--ink);font-size:17px;font-weight:900;line-height:1.4}
.thtoday{display:block;margin-top:2px;font-size:12px;font-weight:900;background:var(--paper);color:var(--ink);border-radius:5px;padding:0 4px}
.tg .th.now{box-shadow:inset 0 0 0 3px var(--ink)}

.ttempty{display:grid;gap:10px;padding:14px;border:2px dashed var(--line);border-radius:var(--r-m)}
.ttempty .add{min-height:56px}

/* 土日祝の色 */
:root{--c-sat:#2160C4;--c-sun:#C8322B;--bg-sat:#EEF4FF;--bg-sun:#FFF0EF}
.wd.sat small,.wd.sat b,.day.sat small,.day.sat b,h1.sat,p.sat{color:var(--c-sat)}
.wd.sun small,.wd.sun b,.day.sun small,.day.sun b,h1.sun,p.sun{color:var(--c-sun)}
.wrow.sat{background:var(--bg-sat)}
.wrow.sun{background:var(--bg-sun)}
.wrow.now{background:var(--soft)}
.day[aria-current="date"].sat small,.day[aria-current="date"].sat b{color:var(--c-sat)}
.day[aria-current="date"].sun small,.day[aria-current="date"].sun b{color:var(--c-sun)}
.hname{display:block;margin-top:2px;font-family:var(--ui);font-size:11px;font-weight:900;line-height:1.2;color:var(--c-sun);text-align:center;overflow-wrap:anywhere;padding:0 2px}
.tg .th.hol{color:var(--c-sun);background:var(--bg-sun)}
.thhol{display:block;margin-top:2px;font-size:11px;font-weight:900;line-height:1.2;color:var(--c-sun);overflow-wrap:anywhere}
.tg .tc.holday{background:repeating-linear-gradient(135deg,#F4F4F4 0 6px,#FFFFFF 6px 12px);color:#9AA0A6;border-bottom-color:#D9DDE1;font-weight:500}
.tg .tc.holday.test{background:#E7B9B6;color:#fff}
@media (min-width:700px){.hname,.thhol{font-size:14px}}

/* タブレット: 画面の幅に合わせて自動で広げる */
@media (min-width:700px){
  body{font-size:19px}
  .app{max-width:none}
  .who,.board{padding-left:28px;padding-right:28px}
  .tray{margin:0 -28px;padding:0 28px}
  main{padding:24px 28px 32px;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px 28px;align-items:start}
  main>.note,main>.add,main>.ghost,main>.wk,main>.stats,main>.empty-box{grid-column:1/-1}
  main>.note{order:-3}
  main>.add{order:-2}
  main>.ghost{order:-1}
  .stats{grid-template-columns:1.4fr 1fr 1fr}
  .stat:first-child{grid-column:auto}
  .wrow{grid-template-columns:84px minmax(0,1fr) minmax(0,1fr)}
  .wrow>*{padding:10px}
  .wc{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
  .it strong{font-size:18px}
  .it em{font-size:14px}
  .day{min-height:86px}
  .tabs div{max-width:640px}
  dialog.wide{max-width:940px}
  .tt-wrap{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
  .tt-wrap>div:first-child{display:block;position:sticky;top:0}
  .photo-box{position:static}
  .photo-scroll{max-height:62dvh}
  dialog{margin:auto;max-width:620px;max-height:88dvh}
  .sheet{padding:22px 24px}
  #go{bottom:10px}
}
/* 横向き: 黒板を左、ノートを右に並べる */
@media (min-width:800px) and (orientation:landscape){
  .app{display:grid;grid-template-columns:clamp(300px,33vw,390px) minmax(0,1fr);grid-template-rows:auto 1fr;align-items:stretch}
  .who{grid-column:1;grid-row:1;padding-left:20px;padding-right:20px}
  .board{grid-column:1;grid-row:2;padding-left:20px;padding-right:20px;align-content:start;grid-auto-rows:min-content}
  .tray{margin:0 -20px;padding:0 20px}
  main{grid-column:2;grid-row:1/3}
}
@media (min-width:700px){
  body{font-size:21px}
  main{padding:26px 28px 36px;gap:28px}
  .tt-now{grid-column:1/-1}
  .tg{grid-template-columns:36px repeat(5,minmax(0,1fr));gap:6px}
  .tg>*,.tg>.tc{font-size:24px;min-height:84px}
  .tg .th{font-size:26px;min-height:72px}
  .tg .th small{font-size:17px}
  .tg .pn{font-size:21px}
  .tc small{font-size:16px}
  .tg.edit>*,.tg.edit>.tc{font-size:19px;min-height:58px}
  .tg.edit .th{min-height:44px}
  .task h2{font-size:27px}
  .task p{font-size:19px}
  .it strong{font-size:20px}
  .it em{font-size:17px}
  .wrow{grid-template-columns:92px minmax(0,1fr) minmax(0,1fr)}
  .wd b{font-size:32px}
  .wdt{font-size:15px;width:calc(100% - 12px)}
  .sec-h,.panel h2,.sheet-head h2{font-size:28px}
  .board-title h1{font-size:40px}
  .say{font-size:25px}
  .tabs div{max-width:860px}
  .tabs button{font-size:19px}
}
/* 横向きタブレット: スクロールしても黒板(日付や名前)を左に残す */
@media (min-width:800px) and (orientation:landscape) and (min-height:600px){
  .app{--side:clamp(300px,33vw,390px);background:linear-gradient(90deg,var(--board) var(--side),var(--paper) var(--side))}
  .who{position:sticky;top:0;z-index:3;align-self:start}
  .board{position:sticky;top:72px;align-self:start}
}
@media (min-width:700px){dialog{border-radius:var(--r-l)}}
@media (prefers-reduced-motion:reduce){.draw path{animation:none;stroke-dashoffset:0}.cele.on{animation:none}}

  <button role="tab" id="tab-day" data-act="tab" data-v="day"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h14v18H5zM9 8h6M9 12h6M9 16h3"/></svg>1日</button>

<script>
const SUBJECTS={
  kokugo:{n:"国語",c:"--s-kokugo"},
  sansu:{n:"算数",c:"--s-sansu"},
  rika:{n:"理科",c:"--s-rika"},
  shakai:{n:"社会",c:"--s-shakai"},
  rikasha:{n:"理科社会",c:"--s-rikasha"},
  eigo:{n:"英語",c:"--s-eigo"},
  other:{n:"その他",c:"--s-other"}
};
/* 回転して選ぶ時間のホイール */
const WHEEL_H=44;
function wheelHTML(kind,label,val,min,max,step=5){
  let h="";for(let n=min;n<=max;n+=step)h+=`<div class="wi" data-n="${n}">${fun(n)}</div>`;
  return `<div class="wheel-wrap"><div class="wheel" tabindex="0" role="spinbutton" aria-label="${label}" aria-valuemin="${min}" aria-valuemax="${max}" aria-valuenow="${val}" aria-valuetext="${fun(val)}" data-wheel="${kind}" data-min="${min}" data-max="${max}" data-step="${step}" data-val="${val}">${h}</div></div>`;
}
function wheelPaint(w){
  const c=w.scrollTop/WHEEL_H,still=matchMedia("(prefers-reduced-motion:reduce)").matches;
  w.querySelectorAll(".wi").forEach((e,i)=>{const d=i-c,a=Math.abs(d);e.classList.toggle("on",a<.5);
    if(a>3.2){e.style.transform="";e.style.opacity="";return}
    e.style.opacity=Math.max(.25,1-a*.28);e.style.transform=still?"":`perspective(260px) rotateX(${(-d*24).toFixed(1)}deg) scale(${(1-a*.05).toFixed(3)})`});
}
function wheelInit(root){if(!$("sheet").open)return;root.querySelectorAll(".wheel").forEach(w=>{w.scrollTop=(+w.dataset.val-+w.dataset.min)/+w.dataset.step*WHEEL_H;wheelPaint(w)})}
function wheelRead(w){
  const min=+w.dataset.min,step=+w.dataset.step,max=+w.dataset.max,v=Math.min(max,Math.max(min,min+Math.round(w.scrollTop/WHEEL_H)*step));
  wheelPaint(w);
  if(!s||+w.dataset.val===v)return;
  w.dataset.val=v;w.setAttribute("aria-valuenow",v);w.setAttribute("aria-valuetext",fun(v));
  if(w.dataset.wheel==="min")s.min=v;else s.plan=v;
}
const wheelGo=(w,v)=>{const m=matchMedia("(prefers-reduced-motion:reduce)").matches;w.scrollTo({top:(v-+w.dataset.min)/+w.dataset.step*WHEEL_H,behavior:m?"auto":"smooth"})};
const PRESETS=["家庭学習","宿題","ポピー"];
const USER_PRESETS={aoi:["くもん"]};
const presets=()=>[...PRESETS,...(USER_PRESETS[who]||[])];
const FEELS={1:"むずかしかった",2:"少しむずかしかった",3:"ふつう",4:"できた",5:"よくできた"};
const OLD_FEEL={easy:4,good:3,hard:2};
const feelText=v=>`${v} ${FEELS[v]}`;
const WD=["日","月","火","水","木","金","土"];
const WDL=WD.map(d=>d+"曜日");
/* 以前の ひらがなの予定を 漢字に直す */
const OLD={"おんどく":"音読","かんじドリル":"漢字ドリル","かんじノート":"漢字ノート","さくぶん":"作文","ほんを よむ":"本を読む","けいさんドリル":"計算ドリル","九九の れんしゅう":"九九の練習","もんだいしゅう":"問題集","とけいの れんしゅう":"時計の練習","きょうかしょを よむ":"教科書を読む","かんさつ":"観察","ノートの まとめ":"ノートのまとめ","ちずを みる":"地図を見る","たんごの れんしゅう":"単語の練習","きいて まねする":"聞いてまねする","えいごの うた":"英語の歌","しゅくだい":"宿題","じかんわりを そろえる":"時間わりをそろえる","ならいごとの れんしゅう":"習い事の練習"};
const migrate=S=>{S.timetables=S.timetables||[];
  S.timetables.forEach(x=>{if(!x.week){const d=new Date(x.savedAt||Date.now());const k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;x.week=x.id===S.ttActive?monday(today()):monday(k)}});S.tests=S.tests||[];S.customSubj=S.customSubj||[];
  S.timetables.forEach(x=>{x.grid=x.grid.map(r=>r.map(l=>l==="英語"?"外国語":l))});S.tests.forEach(x=>{if(x.subj==="英語")x.subj="外国語"});S.tasks.forEach(x=>{x.title=OLD[x.title]||x.title;if(OLD_FEEL[x.feel])x.feel=OLD_FEEL[x.feel]});return S};
const ruby=()=>{}; /* ふりがなは使わない */
const KEY="hanamaru-study-v1";
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=k=>{const[y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)};
const shift=(k,n)=>{const d=parse(k);d.setDate(d.getDate()+n);return key(d)};
const today=()=>key(new Date());
const monday=k=>shift(k,-((parse(k).getDay()+6)%7));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const fun=n=>n+"分";
const hm=n=>n>=60?`${Math.floor(n/60)}時間${n%60?" "+fun(n%60):""}`:fun(n);

const HANA=(()=>{
  /* 内側のうず巻きが、外の花びらの内側の点へそのままつながる */
  const c=32,P=[],T=Math.PI*2,turn=1.75,s=Math.PI/7+T*3/7;
  for(let i=0;i<=60;i++){const t=i/60,a=s-(1-t)*turn*T,r=1+t*12.5;P.push([c+r*Math.cos(a),c+r*Math.sin(a)])}
  for(let i=0;i<=220;i++){const a=s+i/220*T;P.push([c+20*Math.cos(a)+6.5*Math.cos(8*a),c+20*Math.sin(a)+6.5*Math.sin(8*a)])}
  return "M"+P.map(p=>p[0].toFixed(1)+" "+p[1].toFixed(1)).join("L");
})();
const hana=(cls="",w=3.5)=>`<svg class="hana ${cls}" viewBox="0 0 64 64" stroke-width="${w}" aria-hidden="true"><path pathLength="1" d="${HANA}"/></svg>`;
const ICON={
  l:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
  r:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg>'
};
const face=m=>`<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><circle cx="16" cy="16" r="13"/><path d="M11 13v1M21 13v1"/><path d="${m}"/></svg>`;
const FACE={1:face("M10 24c3-5 9-5 12 0"),2:face("M11 22.5c3-2 7-2 10 0"),3:face("M11 21h10"),4:face("M11 19.5c3 3 7 3 10 0"),5:face("M9 18c3 7 11 7 14 0")};

function seed(){
  const t=today(),L=[],add=(date,subj,title,plan,min,feel)=>L.push({id:uid(),date,subj,title,plan,done:min!=null,min:min??null,feel:feel??null,ex:true});
  const A=[["sansu","家庭学習",15],["kokugo","宿題",10],["kokugo","ポピー",15],["eigo","家庭学習",10],["rika","ポピー",10],["shakai","宿題",10]];
  for(let d=1;d<=16;d++){
    if(d%6===0)continue;
    const k=shift(t,-d),a=A[d%A.length],b=A[(d+2)%A.length];
    add(k,a[0],a[1],a[2],a[2]+(d%3?0:5),d%2?3:4);
    add(k,b[0],b[1],b[2],d%5===0?null:b[2],d%4?3:2);
  }
  add(t,"kokugo","宿題",10,10,3);
  add(t,"sansu","家庭学習",15);
  add(t,"eigo","ポピー",10);
  return {tasks:L,timetables:[],tests:[],customSubj:[],ttActive:null,updated:0};
}

const USERS={natsuki:"なつき",aoi:"あおい"};
let state, localOK=true, who="natsuki";
try{const w=localStorage.getItem(KEY+":who");if(USERS[w])who=w}catch(e){localOK=false}
const userKey=()=>KEY+":"+who;
function load(){
  state=null;
  try{
    /* 名前を分ける前の記録は、なつきの記録として引き継ぐ */
    const raw=localStorage.getItem(userKey())||(who==="natsuki"?localStorage.getItem(KEY):null);
    state=raw?migrate(JSON.parse(raw)):null;
  }catch(e){localOK=false}
  if(!state||!Array.isArray(state.tasks))state=seed();
}
load();

const ui={tab:"week",date:today(),week:monday(today()),month:today().slice(0,7)};
let s=null;

function save(){
  state.updated=Date.now();
  try{localStorage.setItem(userKey(),JSON.stringify(state));localOK=true}catch(e){localOK=false}
}
const on=k=>state.tasks.filter(t=>t.date===k);
function status(k){const L=on(k);if(!L.length)return"none";const n=L.filter(t=>t.done).length;return n===L.length?"all":n?"some":"plan"}
function streak(){
  let k=today(),n=0;
  if(!on(k).some(t=>t.done))k=shift(k,-1);
  while(on(k).some(t=>t.done)){n++;k=shift(k,-1)}
  return n;
}
const hasEx=()=>state.tasks.some(t=>t.ex);
function notes(){
  let h="";
  if(!localOK)h+=`<div class="note" role="alert"><span>記録を保存できません。ページをとじる前に、家の人に伝えてね。</span></div>`;
  if(hasEx())h+=`<div class="note"><span>今は見本の記録が入っています。</span><button data-act="clearEx">見本を消す</button></div>`;
  return h;
}

/* どの画面でも「今日は何日」を出す */
/* 日本の祝日(振替休日・国民の休日を含む)を、ネットなしで計算する */
const HOL={};
function holidaysOf(y){
  if(HOL[y])return HOL[y];
  const H={},p=n=>String(n).padStart(2,"0"),k=(m,d)=>`${y}-${p(m)}-${p(d)}`;
  const nth=(m,n)=>{const w=new Date(y,m-1,1).getDay();return 1+((8-w)%7)+(n-1)*7};/* 第n月曜 */
  const a=y-1980,spring=Math.floor(20.8431+0.242194*a-Math.floor(a/4)),autumn=Math.floor(23.2488+0.242194*a-Math.floor(a/4));
  [[1,1,"元日"],[1,nth(1,2),"成人の日"],[2,11,"建国記念の日"],[2,23,"天皇誕生日"],[3,spring,"春分の日"],[4,29,"昭和の日"],
   [5,3,"憲法記念日"],[5,4,"みどりの日"],[5,5,"こどもの日"],[7,nth(7,3),"海の日"],[8,11,"山の日"],[9,nth(9,3),"敬老の日"],
   [9,autumn,"秋分の日"],[10,nth(10,2),"スポーツの日"],[11,3,"文化の日"],[11,23,"勤労感謝の日"]].forEach(([m,d,n])=>{H[k(m,d)]=n});
  /* 国民の休日: 祝日にはさまれた平日 */
  Object.keys(H).forEach(d=>{const n=shift(d,1),n2=shift(d,2);if(!H[n]&&H[n2]&&parse(n).getDay()!==0)H[n]="国民の休日"});
  /* 振替休日: 日曜の祝日のあと、最初の祝日でない日 */
  Object.keys(H).sort().forEach(d=>{if(parse(d).getDay()===0){let n=shift(d,1);while(H[n])n=shift(n,1);H[n]="振替休日"}});
  return HOL[y]=H;
}
const holiday=k=>holidaysOf(+k.slice(0,4))[k]||"";
/* 色分け用: 土曜は sat、日曜と祝日は sun */
const dayKind=k=>holiday(k)||parse(k).getDay()===0?"sun":parse(k).getDay()===6?"sat":"";
const todayLine=()=>{const d=new Date();return `<span class="today-chip">今日は ${d.getMonth()+1}月${d.getDate()}日(${WD[d.getDay()]})</span>`};
function render(){
  document.documentElement.dataset.who=who;
  $("who").innerHTML=Object.entries(USERS).map(([k,n])=>`<button data-act="who" data-v="${k}" aria-pressed="${k===who}">${n}</button>`).join("");
  ["week","day","tt","res","rec"].forEach(n=>$("tab-"+n).setAttribute("aria-selected",ui.tab===n));
  ({week:renderWeek,day:renderDay,tt:renderTT,res:renderRes,rec:renderRec})[ui.tab]();
  ruby($("board"));ruby($("main"));hydrate($("main"));
}
const chalks=L=>`<div class="tray" aria-hidden="true">${L.slice(0,8).map(x=>`<i class="${x.done?"on":""}" style="--c:var(${SUBJECTS[x.subj].c})"></i>`).join("")}</div>`;
const weekDays=w=>Array.from({length:7},(_,i)=>shift(w,i));
function renderWeek(){
  const t=today(),D=weekDays(ui.week),A=parse(D[0]),B=parse(D[6]),L=D.flatMap(on);
  const todo=L.filter(x=>!x.done).length,did=L.length-todo,cur=monday(t);
  const range=`${A.getDate()}日〜${A.getMonth()===B.getMonth()?"":(B.getMonth()+1)+"月"}${B.getDate()}日`;
  const rel=ui.week===cur?"今週":ui.week===shift(cur,7)?"来週":ui.week===shift(cur,-7)?"先週":"";
  $("board").innerHTML=`
    <div class="board-top">
      <div class="board-title">${todayLine()}<h1>${range}</h1><p>${A.getMonth()+1}月${rel?" ・ "+rel:""}</p></div>
      <button class="nav-btn" data-act="week" data-v="-7" aria-label="前の週">${ICON.l}</button>
      <button class="nav-btn" data-act="week" data-v="7" aria-label="次の週">${ICON.r}</button>
    </div>
    <div class="say"><span>やること${todo}つ ・ やったこと${did}つ</span>${ui.week!==cur?'<button data-act="goToday">今週にもどる</button>':""}</div>
    ${chalks(L)}`;
  const item=x=>{const S=SUBJECTS[x.subj];return `<button class="it" style="--c:var(${S.c})" data-act="open" data-v="${x.id}" aria-label="${S.n} ${esc(x.title)} ${x.note?esc(x.note)+" ":""}${fun(x.done?x.min:x.plan)}${x.done?"やった":""}"><strong>${esc(x.title)}</strong>${x.done?hana("",5):""}${x.note?`<em class="nt">${esc(x.note)}</em>`:""}<em>${S.n} ${fun(x.done?x.min:x.plan)}</em></button>`};
  const rows=D.map(k=>{
    const d=parse(k),l=on(k);
    return `<div class="wrow${k===t?" now":""} ${dayKind(k)}">
      <div class="wdc"><button class="wd ${dayKind(k)}" data-act="jump" data-v="${k}" aria-label="${d.getMonth()+1}月${d.getDate()}日 ${WDL[d.getDay()]}${holiday(k)?" "+holiday(k):""}${testsOn(k).map(x=>" "+esc(testName(x))).join("")}を開く"><small>${WD[d.getDay()]}</small><b>${d.getDate()}</b>${holiday(k)?`<span class="hname">${holiday(k)}</span>`:""}${k===t?"<i>今日</i>":""}${testsOn(k).map(x=>`<span class="wdt">${esc(x.subj)}<br>テスト</span>`).join("")}</button></div>
      <div class="wc">${l.filter(x=>!x.done).map(item).join("")}<button class="plus" data-act="new" data-v="${k}" aria-label="${d.getDate()}日に計画を足す">+ 足す</button></div>
      <div class="wc">${l.filter(x=>x.done).map(item).join("")}</div></div>`;
  }).join("");
  const canCopy=!L.length&&weekDays(shift(ui.week,-7)).some(k=>on(k).length)&&D[6]>=t;
  $("main").innerHTML=notes()+
    `<button class="add" data-act="new"><span aria-hidden="true">+</span>1週間の計画を立てる</button><button class="ghost" data-act="ttPlan">時間割から計画を作る</button>`+
    (canCopy?'<button class="ghost" data-act="copyWeek">前の週と同じにする</button>':"")+
    `<div class="wk"><div class="wrow hd"><div>日</div><div>やること</div><div>やったこと</div></div>${rows}</div>`;
}
function renderDay(){
  const k=ui.date,d=parse(k),t=today(),L=on(k),n=L.filter(x=>x.done).length;
  let days="";
  for(let i=0;i<7;i++){
    const c=shift(ui.week,i),x=parse(c),st=status(c);
    const m=st==="all"?hana("",5):st==="none"?"":'<span class="dot"></span>';
    const lab=`${x.getMonth()+1}月${x.getDate()}日 ${WDL[x.getDay()]}${holiday(c)?" "+holiday(c):""}${st==="all"?" 花丸":""}`;
    days+=`<button class="day${c===t?" is-today":""} ${dayKind(c)}" data-act="day" data-v="${c}" aria-label="${lab}" ${c===k?'aria-current="date"':""}><small>${WD[x.getDay()]}</small><b>${x.getDate()}</b><span class="mark" style="width:22px">${m}</span></button>`;
  }
  const say=!L.length?(k<t?"この日の計画はなし":"計画を立てよう"):n===L.length?"全部できたね!":`やること${L.length-n}つ ・ やったこと${n}つ`;
  $("board").innerHTML=`
    <div class="board-top">
      <div class="board-title">${k===t?"":todayLine()}<h1 class="${dayKind(k)}">${d.getMonth()+1}月 ${d.getDate()}日</h1><p class="${dayKind(k)}">${WDL[d.getDay()]}${holiday(k)?" ・ "+holiday(k):""}${k===t?"(今日)":k===shift(t,1)?"(明日)":k===shift(t,-1)?"(昨日)":""}</p></div>
      <button class="nav-btn" data-act="week" data-v="-7" aria-label="前の週">${ICON.l}</button>
      <button class="nav-btn" data-act="week" data-v="7" aria-label="次の週">${ICON.r}</button>
    </div>
    <div class="week">${days}</div>
    <div class="say"><span>${say}</span>${k!==t?'<button data-act="goToday">今日にもどる</button>':""}</div>
    ${chalks(L)}`;
  const row=x=>{
    const S=SUBJECTS[x.subj];
    const meta=x.done?`${S.n} ・ ${fun(x.min)}やった`+(x.feel?` ・ ${feelText(x.feel)}`:""):`${S.n} ・ ${fun(x.plan)}`+(k<t?" ・ まだ":"");
    return `<button class="task${x.done?" done":""}" style="--c:var(${S.c})" data-act="open" data-v="${x.id}" data-task="${x.id}">
      <span class="bar"></span><span><h2>${esc(x.title)}</h2>${x.note?`<p class="nt">${esc(x.note)}</p>`:""}<p>${meta}</p></span>
      <span class="ring">${x.done?hana():`<span class="empty">${k>t?"":"できた"}</span>`}</span></button>`;
  };
  const todo=L.filter(x=>!x.done),did=L.filter(x=>x.done),prev=on(shift(k,-1)).length;
  const sec=(name,A,none)=>`<section class="sec"><h2 class="sec-h">${name}<span>${A.length}つ</span></h2>${A.length?`<div class="list">${A.map(row).join("")}</div>`:`<p class="none">${none}</p>`}</section>`;
  const add=`<button class="add" data-act="new"><span aria-hidden="true">+</span>計画を足す</button>`;

/* 写真は容量が大きいので IndexedDB に保存する */
const PHOTO_DB="hanamaru-study-photos",PHOTO_STORE="photos";
const photoCache={};
function idb(mode,fn){
  return new Promise((ok,ng)=>{
    const r=indexedDB.open(PHOTO_DB,1);
    r.onupgradeneeded=()=>r.result.createObjectStore(PHOTO_STORE);
    r.onerror=()=>ng(r.error);
    r.onsuccess=()=>{const db=r.result,tx=db.transaction(PHOTO_STORE,mode),q=fn(tx.objectStore(PHOTO_STORE));
      tx.oncomplete=()=>{db.close();ok(q&&q.result)};tx.onerror=tx.onabort=()=>{db.close();ng(tx.error)}};
  });
}
const putPhoto=(id,v)=>idb("readwrite",o=>o.put(v,id)).then(()=>{photoCache[id]=v});
const getPhoto=id=>photoCache[id]?Promise.resolve(photoCache[id]):idb("readonly",o=>o.get(id)).then(v=>{if(v)photoCache[id]=v;return v});
const delPhoto=id=>{delete photoCache[id];return idb("readwrite",o=>o.delete(id))};
async function allPhotos(){
  const keys=await idb("readonly",o=>o.getAllKeys()),out={};
  for(const k of keys||[])out[k]=await getPhoto(k);
  return out;
}
function hydrate(root){root.querySelectorAll("img[data-photo]").forEach(i=>getPhoto(i.dataset.photo).then(v=>{if(v)i.src=v;else i.alt="写真なし"}).catch(()=>{i.alt="写真を読みこめません"}))}
function shrink(file){
  return new Promise((ok,ng)=>{
    const u=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{const k=Math.min(1,1400/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement("canvas");
      c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      URL.revokeObjectURL(u);ok(c.toDataURL("image/jpeg",.75))};
    im.onerror=()=>{URL.revokeObjectURL(u);ng(new Error("image"))};im.src=u;
  });
}

        <div class="scale"><span>1 むずかしかった</span><span>5 よくできた</span></div><p class="picked" aria-live="polite">${s.feel?feelText(s.feel):"数字を選んでね"}</p></fieldset>

      <button class="link${s.del?" warn":""}" data-act="del">${s.del?"本当に消す":"この計画を消す"}</button></div>`;
  }
  $("sheetBody").innerHTML=h;
  ruby($("sheetBody"));hydrate($("sheetBody"));wheelInit($("sheetBody"));
  if(fa){const el=[...$("sheetBody").querySelectorAll("[data-act]")].find(e=>e.dataset.act===fa&&e.dataset.v===fv);if(el)el.focus()}
}
